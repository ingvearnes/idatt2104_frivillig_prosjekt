name: CI – logic & peer

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  detect-changes:
    runs-on: self-hosted               
    permissions:
      contents: read
      pull-requests: read
    outputs:
      peer: ${{ steps.filter.outputs.peer }}
      logic:  ${{ steps.filter.outputs.logic }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            peer:
              - 'peer/**'
            logic:
              - 'logic/**'


# ==== PEER ====
  build-peer:
    needs: detect-changes
    if: needs.detect-changes.outputs.peer == 'true'
    runs-on: self-hosted              
    defaults:
      run:
        working-directory: peer
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
       
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: peer

      - name: Run tests
        run: cargo test

      - name: Build it bitch
        run: cargo build --release

# ===== LOGIC =====
  build-logic:
    needs: detect-changes
    if: needs.detect-changes.outputs.logic == 'true'
    runs-on: self-hosted              
    defaults:
      run:
        working-directory: logic
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
       
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: logic

      - name: Run tests
        run: cargo test

      - name: Build bitch
        run: cargo build --release
